services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  classifier:
    image: finance-classifier:dev
    build: ./finance-tracker-model
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: finance-api:dev
    build: ./FinanceTracker.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FinanceTrackerDockerDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Classifier__BaseUrl: http://classifier:8000/
    ports:
      - "127.0.0.1:5260:8080"
    depends_on:
      db:
        condition: service_healthy
      classifier:
        condition: service_healthy
  frontend:
    image: finance-frontend:dev
    build: ./finance-tracker-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
        
volumes:
  sql-data: